[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citywheels-help-desk"
version = "0.1.0"
description = "CLI help-desk agent for the CityWheels bike rental shop"
requires-python = ">=3.11"
dependencies = [
    "openai==3.40.0",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.setuptools]
packages = ["citywheels"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
